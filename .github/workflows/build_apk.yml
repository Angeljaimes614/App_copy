name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK con Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            cmake

      - name: Cache de Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Instalar Android cmdline-tools donde Buildozer las espera
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          if [ ! -f "$SDK_DIR/tools/bin/sdkmanager" ]; then
            mkdir -p $SDK_DIR
            cd $SDK_DIR
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip
            # Buildozer busca sdkmanager en tools/bin (ubicacion legacy)
            mv cmdline-tools tools
            rm /tmp/cmdline-tools.zip
          fi

      - name: Pre-aceptar licencias del Android SDK
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR/licenses
          cd $SDK_DIR/licenses
          {
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee"
            echo "d56f5187479451eabf01fb78af6dfcb131a6481e"
            echo "8933bad161af4178b1185d1a37fbf41ea5269c55"
          } > android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > android-sdk-preview-license
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > android-googletv-license
          echo "859f317696f67ef3d7f30a50a5560e7834b43903" > android-sdk-arm-dbt-license
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" > intel-android-extra-license
          {
            echo "e9acab5b5fbb560a72cfaecce8946896ff6aab9d"
            echo "504667f4c0de7af1a06de9f4b1727b84351f2910"
          } > mips-android-sysimage-license
          # Por si sdkmanager pregunta otras: aceptar todo lo restante
          yes | $SDK_DIR/tools/bin/sdkmanager --sdk_root=$SDK_DIR --licenses > /dev/null 2>&1 || true

      - name: Instalar Buildozer y Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.36 buildozer

      - name: Compilar APK
        run: buildozer -v android debug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: copybot-apk
          path: bin/*.apk
          if-no-files-found: error
